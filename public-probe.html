<!doctype html>
<html>
<head><meta charset="utf-8"><title>gpu probe</title></head>
<body>
<div id="out">probing</div>
<script>
  (async () => {
    const out = document.getElementById('out');
    if (!('gpu' in navigator)) { out.textContent = 'NO_GPU_OBJECT'; return; }
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { out.textContent = 'NO_ADAPTER'; return; }
      const device = await adapter.requestDevice();
      const info = adapter.info ? `${adapter.info.vendor} ${adapter.info.architecture}` : 'n/a';
      out.textContent = `OK adapter=${info} limits.maxStorageBufferBindingSize=${adapter.limits.maxStorageBufferBindingSize}`;
      device.destroy();
    } catch (e) {
      out.textContent = 'ERROR:' + e.message;
    }
  })();
</script>
</body>
</html>
